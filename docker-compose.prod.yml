services:
  app:
    image: ghcr.io/${{ github.repository_owner }}/facial-emotion-detection:latest
    ports:
      - "8501:8501"
    #environment:
    #  - WANDB_API_KEY=${WANDB_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s